name: build-app

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run factory:selftest
      - run: npm run build:bundle
      - name: Smoke test (server bundle)
        run: |
          PORT=8999 BAMSAM_NO_OPEN=1 node dist/app.cjs &
          sleep 3
          curl -sf "http://localhost:8999/" -o /dev/null
          curl -sf "http://localhost:8999/worksheet?course=mijeokbun1&d1=on&d2=on&count=5&key=on" -o /tmp/ws.html
          grep -q "정답표" /tmp/ws.html && echo "smoke OK"
          kill %1

  build-win:
    needs: test
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:bundle
      - name: Set build version (0.2.<run>)
        run: npm version --no-git-tag-version 0.2.${{ github.run_number }}
      - name: Build & publish installer (auto-update feed)
        run: npx electron-builder --win --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/BamsamFactory-Setup-*.exe
