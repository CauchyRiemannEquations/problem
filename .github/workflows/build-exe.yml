name: build-exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:bundle
      - name: Package executables
        run: |
          npx pkg dist/app.cjs -t node20-win-x64 -o dist/BamsamFactory-win.exe
          npx pkg dist/app.cjs -t node20-macos-x64 -o dist/BamsamFactory-macos
          npx pkg dist/app.cjs -t node20-linux-x64 -o dist/BamsamFactory-linux
      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: dist/BamsamFactory*
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "밤샘 문제공장 v0.1.0"
          files: dist/BamsamFactory*
